<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arizen School</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Nunito', system-ui, sans-serif; background: #F7FBF7; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: white; border-radius: 24px; padding: 40px; text-align: center; max-width: 480px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); border: 1px solid #E2E8F0; }
    .logo { width: 64px; height: 64px; border-radius: 16px; background: #047A70; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 1.5rem; margin: 0 auto 20px; }
    h1 { font-size: 1.5rem; font-weight: 900; color: #0F172A; margin-bottom: 8px; }
    p { color: #64748B; margin-bottom: 24px; }
    a { display: inline-block; background: #047A70; color: #fff; font-weight: 700; padding: 12px 24px; border-radius: 12px; text-decoration: none; margin: 4px; }
    a:hover { background: #005B50; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">A</div>
    <h1>Arizen School</h1>
    <p>Emotionally intelligent CBC learning for your child.</p>
    <div>
      <a href="/auth/login">Sign In</a>
      <a href="/auth/register" style="background: #fff; color: #047A70; border: 2px solid #047A70;">Get Started</a>
    </div>
  </div>
</body>
</html>
